name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

# A newer push to the same branch/PR cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # `next build` has been verified to succeed with no environment variables at all
      # (Supabase/AI keys are only read at request time inside API routes and services).
      # If a future change starts requiring a variable at build time, add it here
      # (placeholder for NEXT_PUBLIC_*) or as a repository secret.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
